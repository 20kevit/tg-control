name: ci

# Hosted mirror of the canonical local gate (`scripts/ci.sh`). It never publishes
# images, creates releases or deploys anything, and it uses read-only repository
# permissions. Third-party actions are pinned to immutable commit SHAs.
on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: lint, contracts, traceability, tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked runtime dependencies and pinned dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          # Dev tools are pinned by exact version in [project.optional-dependencies]
          # but not hash-locked; runtime packages are already resolved above, so
          # this install cannot move them to a different version.
          python -m pip install -e '.[dev]'
          python -m pip check

      - name: Install browser-test dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.2
        with:
          node-version: "22"

      - name: Install node test dependencies
        run: npm ci

      - name: Canonical local gate (lint, contracts, traceability, coverage, full suite)
        env:
          PYTHON: python
          TG_COVERAGE: "1"
        # `pipefail` is required: otherwise `tee` decides the exit status and a
        # failing suite would still look green.
        run: |
          set -o pipefail
          if ! PYTHON=python scripts/ci.sh 2>&1 | tee pytest.log; then
            echo "::error title=local-gate::$(grep -E 'FAILED|ERROR|error:|Traceback' pytest.log | tail -n 3 | tr '\n' ' ')"
            exit 1
          fi

      - name: Dependency vulnerability audit (network required)
        # pip-audit is installed with its own dependencies (it is a tool, not a
        # runtime dependency); the audit resolves requirements.lock, not the env.
        run: |
          set -o pipefail
          python -m pip install "pip-audit==2.10.1"
          if ! pip-audit -r requirements.lock --strict 2>&1 | tee pip-audit.log; then
            echo "::error title=dependency-audit::$(tail -n 3 pip-audit.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Release provenance (does not build or publish)
        run: python scripts/build_release.py --dry-run > release-provenance.json

      - name: Upload test and provenance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        with:
          name: quality-evidence
          path: |
            pytest.log
            pip-audit.log
            .coverage
            release-provenance.json
          if-no-files-found: warn

  container:
    name: image build, compose validation, container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: "3.11"

      - name: Validate Dockerfile, Compose and workflow statically
        # The deployment assertions import the application (through the shared
        # conftest), so the runtime dependency set must be installed here too.
        # Without it pytest exits 4 (usage error) and the job is misleadingly red.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --require-hashes -r requirements.lock
          python3 -m pip install --no-deps -e .
          python3 -m pip install --disable-pip-version-check pytest==9.2.0 pyyaml==6.0.3
          python3 -m pytest -q tests/test_deployment.py

      - name: Build image and run the disposable container smoke test
        # `pipefail` matters here: without it a failing smoke script is masked by
        # `tee` and the job only fails later, with no reason attached.
        run: |
          set -o pipefail
          bash scripts/container_smoke.sh 2>&1 | tee container-smoke.log || {
            REASON="$(grep -aE '^FAIL:|\[FAIL\]|\[ERROR\]' container-smoke.log | tail -n 4 | tr -d '\r' | tr '\n' ' ' | cut -c1-400)"
            [ -n "$REASON" ] || REASON="$(tail -n 3 container-smoke.log | tr -d '\r' | tr '\n' ' ' | cut -c1-400)"
            printf '::error title=container-smoke::%s\n' "$REASON"
            exit 1
          }

      - name: Inspect image safety properties
        # Each assertion reports the observed value as an annotation so a failure
        # on a hosted runner is diagnosable without downloading logs.
        run: |
          set -euo pipefail
          IMAGE=tg-control:local
          docker image ls --digests | tee images.txt
          if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
            PRESENT="$(docker image ls --format '{{.Repository}}:{{.Tag}}' | tr '\n' ' ')"
            echo "::error title=image-unavailable::expected $IMAGE; present: ${PRESENT}"
            exit 1
          fi
          CONFIGURED_USER="$(docker image inspect -f '{{.Config.User}}' "$IMAGE")"
          echo "::notice title=image-user::configured user '${CONFIGURED_USER}'"
          if [ "$CONFIGURED_USER" != "10001:10001" ]; then
            echo "::error title=image-user::expected 10001:10001, observed '${CONFIGURED_USER}'"
            exit 1
          fi
          docker image inspect -f '{{json .Config.Env}}' "$IMAGE" | tee image-env.json
          if grep -Eqi '(TOKEN|SECRET|PASSWORD|DATABASE_URL)=' image-env.json; then
            echo "::error title=image-env::image environment contains secret-like variables"
            exit 1
          fi
          docker history --no-trunc "$IMAGE" > image-history.txt

      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        with:
          name: container-evidence
          path: |
            container-smoke.log
            images.txt
            image-env.json
            image-history.txt
          if-no-files-found: warn

      - name: Tear down containers
        if: always()
        run: docker compose down --remove-orphans || true
