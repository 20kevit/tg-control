name: ci

# Hosted mirror of the canonical local gate (`scripts/ci.sh`). It never publishes
# images, creates releases or deploys anything, and it uses read-only repository
# permissions. Third-party actions are pinned to immutable commit SHAs.
on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: lint, contracts, traceability, tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install hash-locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Install browser-test dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.2
        with:
          node-version: "22"

      - name: Install node test dependencies
        run: npm ci

      - name: Canonical local gate (lint, contracts, traceability, full suite)
        env:
          PYTHON: python
        run: PYTHON=python scripts/ci.sh 2>&1 | tee pytest.log

      - name: Release provenance (does not build or publish)
        run: python scripts/build_release.py --dry-run > release-provenance.json

      - name: Upload test and provenance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        with:
          name: quality-evidence
          path: |
            pytest.log
            release-provenance.json
          if-no-files-found: warn

  container:
    name: image build, compose validation, container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          persist-credentials: false

      - name: Validate Dockerfile, Compose and workflow statically
        run: |
          python3 -m pip install --disable-pip-version-check pytest==9.2.0 pyyaml==6.0.3
          python3 -m pytest -q tests/test_deployment.py

      - name: Build image and run the disposable container smoke test
        run: bash scripts/container_smoke.sh 2>&1 | tee container-smoke.log

      - name: Inspect image safety properties
        run: |
          IMAGE=tg-control:local
          CONFIGURED_USER="$(docker image inspect -f '{{.Config.User}}' "$IMAGE")"
          test "$CONFIGURED_USER" = "10001:10001"
          docker image inspect -f '{{json .Config.Env}}' "$IMAGE" | tee image-env.json
          if grep -Eqi '(TOKEN|SECRET|PASSWORD|DATABASE_URL)=' image-env.json; then
            echo "image environment contains secret-like variables" >&2
            exit 1
          fi
          docker history --no-trunc "$IMAGE" > image-history.txt

      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.4.0
        with:
          name: container-evidence
          path: |
            container-smoke.log
            image-env.json
            image-history.txt
          if-no-files-found: warn

      - name: Tear down containers
        if: always()
        run: docker compose down --remove-orphans || true
